<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch 3</title>
</head>

<body>
    <script>
        let voc = prompt("Ingrese una vocal (a, e, i, o, u):");
        switch (voc) {
            case "a":
                alert("La " + voc + " es una vocal");
                break;
            case "e":
                alert("La " + voc + " es una vocal");
                break;
            case "i":
                alert("La " + voc + " es una vocal");
                break;
            case "o":
                alert("La " + voc + " es una vocal");
                break;
            case "u":
                alert("La " + voc + " es una vocal");
                break;
            default:
                alert("La " + voc + " es una consonante");
        }
    </script>
</body>

</html>
