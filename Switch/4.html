<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch 4</title>
</head>

<body>
    <script>
        let menu = parseInt(prompt("Ingrese el numero de la opcion del menu (1-4)"));
        switch (menu) {
            case 1:
                alert("Tu eleccion de menu fue " + menu + " este contiene Hamburguesa por $15.000");
                break;
            case 2:
                alert("Tu eleccion de menu fue " + menu + " este contiene Pizza por $12.000");
                break;
            case 3:
                alert("Tu eleccion de menu fue " + menu + " este contiene Perro caliente por $10.000");
                break;
            case 4:
                alert("Tu eleccion de menu fue " + menu + " este contiene ensalada por $8.000");
                break;
            default:
                alert("El numero no coincide con el numero del menu");
        }
    </script>
</body>

</html>
