<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch 2</title>
</head>
<body>
    <script>
        let Nota = prompt("Ingrese su calificacion (A, B, C, D, F):");
        switch (Nota) {
            case "A":
            alert("Tu nota es EXCELENTE");
            break;
            case "B":
            alert("Tu nota es BUENA");
            break;
            case "C":
            alert("Tu nota es ACEPTABLE");
            break;
            case "D":
            alert("Tu nota es INSUFICIENTE");
            break;
            case "F":
            alert("Tu nota es REPROBADO")
            default:
            alert("La nota ingresada no ")
        }
    </script>
</body>
</html>
