<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch 9</title>
</head>

<body>
    <script>
        let estacion = parseInt(prompt("Ingrese un mes del año para saber su estacion"));
        switch (estacion) {
            case 1:
                alert("Mes enero corresponde a INVIERNO");
                break;
            case 2:
                alert("Mes febrero corresponde a INVIERNO");
                break;
            case 3:
                alert("Mes marzo corresponde a PRIMAVERA");
                break;
            case 4:
                alert("Mes abril corresponde a PRIMAVERA");
                break;
            case 5:
                alert("Mes mayo corresponde a PRIMAVERA");
                break;
            case 6:
                alert("Mes junio corresponde a VERANO");
                break;
            case 7:
                alert("Mes julio corresponde a VERANO");
                break;
            case 8:
                alert("Mes agosto corresponde a VERANO");
                break;
            case 9:
                alert("Mes septiembre corresponde a OTOÑO");
                break;
            case 10:
                alert("Mes octubre corresponde a OTOÑO");
                break;
            case 11:
                alert("Mes noviembre corresponde a OTOÑO");
                break;
            case 12:
                alert("Mes diciembre corresponde a INVIERNO");
                break;
            default:
                alert("El numero ingresado no corresponde a un mes del año");
        }
    </script>
</body>

</html>
